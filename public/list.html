<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>お問い合わせ一覧</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card list-page">
    <h1>お問い合わせ一覧</h1>
    <p class="lead">
      直近50件の問い合わせを表示します（社内確認用の簡易ページです。認証はありません）。
    </p>

    <div id="list-status" role="status" aria-live="polite"></div>
    <div class="table-wrap">
      <table id="list-table" hidden>
        <thead>
          <tr>
            <th>日時</th>
            <th>お名前</th>
            <th>メールアドレス</th>
            <th>種別</th>
            <th>お問い合わせ内容</th>
          </tr>
        </thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>
    <p id="list-empty" class="empty" hidden>問い合わせはまだありません。</p>

    <p><a class="button-link" href="index.html">フォームに戻る</a></p>
  </main>

  <script src="list.js"></script>
</body>
</html>
