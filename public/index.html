<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせフォーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>お問い合わせ</h1>
    <p class="lead">ご質問・ご相談はこちらのフォームからお送りください。</p>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="name">お名前 <span class="required">必須</span></label>
        <input type="text" id="name" name="name" required maxlength="100" autocomplete="name" />
        <p class="error" data-error-for="name"></p>
      </div>

      <div class="field">
        <label for="email">メールアドレス <span class="required">必須</span></label>
        <input type="email" id="email" name="email" required maxlength="255" autocomplete="email" />
        <p class="error" data-error-for="email"></p>
      </div>

      <div class="field">
        <label for="category">お問い合わせ種別 <span class="required">必須</span></label>
        <select id="category" name="category" required>
          <option value="" selected disabled>選択してください</option>
          <option value="general">一般的なお問い合わせ</option>
          <option value="product">製品・サービスについて</option>
          <option value="quote">お見積もり・体験のご相談</option>
          <option value="other">その他</option>
        </select>
        <p class="error" data-error-for="category"></p>
      </div>

      <div class="field">
        <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
        <textarea id="message" name="message" rows="6" required maxlength="2000"></textarea>
        <p class="error" data-error-for="message"></p>
      </div>

      <button type="submit" id="submit-btn">送信する</button>
    </form>

    <div id="form-status" role="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
